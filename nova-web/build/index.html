<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOVA Marketing &amp; Advertising Agency — Website Under Process</title>
  <meta name="description" content="The NOVA Marketing &amp; Advertising Agency website is currently under process. Launching soon." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="assets/inova-logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ambient animated background -->
  <div class="ambient" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
    <span class="grid"></span>
  </div>

  <main class="stage">
    <section class="card" role="status" aria-live="polite">

      <div class="logo-wrap">
        <div class="logo-frame">
          <img class="logo" src="assets/inova-logo.jpg"
               alt="INOVA Marketing &amp; Advertising Agency"
               width="1280" height="614" />
          <span class="logo-shine" aria-hidden="true"></span>
        </div>
      </div>

      <span class="rule" aria-hidden="true"></span>

      <h1 class="headline" data-split>Website is loading</h1>

      <p class="subline">
        Our new website is currently <strong>under process</strong>.
        We are putting the final touches on something great.
      </p>

      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Build progress">
        <div class="progress__track"><div class="progress__fill"></div></div>
        <div class="progress__meta">
          <span class="progress__phase">Initializing</span>
          <span class="progress__value">0%</span>
        </div>
      </div>

      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>

      <div class="badge">
        <span class="badge__pulse" aria-hidden="true"></span>
        Under construction — launching soon
      </div>
    </section>

    <footer class="footer">
      &copy; <span id="year">2026</span> NOVA Marketing &amp; Advertising Agency
    </footer>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
